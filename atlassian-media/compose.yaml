name: atlassian-media

services:
  atlassian-media:
    build: .
    image: atlassian-media-mcp:0.1.0
    restart: always
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ATLASSIAN_SITE_URL: "${ATLASSIAN_SITE_URL:?Set ATLASSIAN_SITE_URL}"
      ATLASSIAN_CLOUD_ID: "${ATLASSIAN_CLOUD_ID:?Set ATLASSIAN_CLOUD_ID}"
      ATLASSIAN_AUTH_MODE: "${ATLASSIAN_AUTH_MODE:-scoped}"
      ATLASSIAN_EMAIL: "${ATLASSIAN_EMAIL:?Set ATLASSIAN_EMAIL}"
      ATLASSIAN_API_TOKEN: "${ATLASSIAN_API_TOKEN:?Set ATLASSIAN_API_TOKEN}"
      ATLASSIAN_API_TOKEN_EXPIRES_ON: "${ATLASSIAN_API_TOKEN_EXPIRES_ON:-}"
    networks: [gateway]
    ports: ["127.0.0.1:9005:9005"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:9005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}

networks:
  gateway:
    external: true
    name: "${MCPX_NETWORK:-lunar-mcpx_default}"
