name: Check custom MCPs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teams:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teams
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  atlassian-media:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlassian-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: atlassian-media/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  rea:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rea
    steps:
      - uses: actions/checkout@v4
      - run: docker buildx build --check .
      - run: docker build -t rea-mcp-local:check .
